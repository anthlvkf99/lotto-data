name: update-draws

on:
  schedule:
    - cron: "0 13 * * 6"   # 토요일 22:00 (한국시간)
    - cron: "0 0 * * 0"    # 일요일 09:00 (한국시간, 재시도용)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_draws.py
      - run: |
          git config user.name "draws-bot"
          git config user.email "draws-bot@users.noreply.github.com"
          git add draws.json
          git diff --cached --quiet || (git commit -m "update draws" && git push)
